<rect width="1600" height="1060" fill="#F2F3FB"/><text x="800" y="58" text-anchor="middle" font-family="Inter,Arial" font-size="18" font-weight="700" letter-spacing="4" fill="#5B61ED">CAREMATCH  /  NURSEAI</text><text x="800" y="103" text-anchor="middle" font-family="Inter,Arial" font-size="34" font-weight="750" fill="#111C5B">A calmer way to understand your health</text>
<!-- phones -->
<g font-family="Inter,Arial" fill="#111C5B">
<!-- shared phone shells -->
<g id="shell"><rect width="340" height="820" rx="38" fill="#FEFEFF" filter="url(#sh)"/><rect x="124" y="12" width="92" height="8" rx="4" fill="#E8DCFA"/><circle cx="232" cy="16" r="4" fill="#E8DCFA"/></g>
<!-- screen 1 home -->
<g transform="translate(55 160)"><use href="#shell"/><text x="25" y="66" font-size="15" fill="#5B61ED" font-weight="700">CareMatch</text><circle cx="300" cy="60" r="16" fill="#E8DCFA"/><text x="26" y="120" font-size="25" font-weight="750">Good morning,</text><text x="26" y="151" font-size="25" font-weight="750">Alexandra</text><text x="26" y="180" font-size="13" fill="#68739A">How can we help you today?</text><rect x="20" y="205" width="300" height="190" rx="28" fill="url(#hero)"/><circle cx="276" cy="240" r="65" fill="#FFFFFF" opacity=".12"/><text x="42" y="247" font-size="13" fill="#FEFEFF" font-weight="700">YOUR AI HEALTH GUIDE</text><text x="42" y="280" font-size="24" fill="#FEFEFF" font-weight="750">Not feeling quite</text><text x="42" y="310" font-size="24" fill="#FEFEFF" font-weight="750">yourself?</text><text x="42" y="342" font-size="12" fill="#FEFEFF">Get a helpful next step in minutes.</text><rect x="42" y="359" width="145" height="28" rx="14" fill="#FEFEFF"/><text x="114" y="378" text-anchor="middle" font-size="11" font-weight="700" fill="#5B61ED">Start checkup  →</text><text x="24" y="440" font-size="17" font-weight="700">Quick access</text><g font-size="11" font-weight="650" text-anchor="middle"><rect x="20" y="458" width="68" height="78" rx="18" fill="#E8DCFA"/><text x="54" y="491" font-size="23" fill="#5B61ED">✚</text><text x="54" y="520">Doctors</text><rect x="101" y="458" width="68" height="78" rx="18" fill="#EAF1FF"/><text x="135" y="491" font-size="22" fill="#5B61ED">♡</text><text x="135" y="520">Consult</text><rect x="182" y="458" width="68" height="78" rx="18" fill="#E8DCFA"/><text x="216" y="491" font-size="22" fill="#5B61ED">▣</text><text x="216" y="520">Records</text><rect x="263" y="458" width="57" height="78" rx="18" fill="#EAF1FF"/><text x="291" y="491" font-size="22" fill="#5B61ED">⌖</text><text x="291" y="520">More</text></g><text x="24" y="582" font-size="17" font-weight="700">Recommended for you</text><rect x="20" y="598" width="300" height="105" rx="20" fill="#F2F3FB"/><circle cx="62" cy="650" r="24" fill="#E8DCFA"/><text x="99" y="638" font-size="13" font-weight="700">Annual wellness visit</text><text x="99" y="660" font-size="11" fill="#68739A">A little care goes a long way</text><text x="99" y="684" font-size="11" fill="#5B61ED" font-weight="700">Book a doctor  →</text><rect x="0" y="760" width="340" height="60" rx="0" fill="#FEFEFF"/><text x="55" y="795" font-size="11" fill="#5B61ED">⌂ Home</text><text x="145" y="795" font-size="11" fill="#8790AF">Doctors</text><text x="230" y="795" font-size="11" fill="#8790AF">Care</text><text x="295" y="795" font-size="11" fill="#8790AF">You</text></g>
<!-- screen 2 onboarding -->
<g transform="translate(445 160)"><use href="#shell"/><text x="25" y="66" font-size="14" fill="#5B61ED">←</text><text x="26" y="120" font-size="25" font-weight="750">Let’s understand</text><text x="26" y="151" font-size="25" font-weight="750">what’s going on.</text><text x="26" y="181" font-size="12" fill="#68739A">A few details help NurseAI guide you.</text><rect x="20" y="210" width="300" height="94" rx="22" fill="#E8DCFA"/><circle cx="69" cy="257" r="29" fill="#FEFEFF"/><text x="69" y="266" text-anchor="middle" font-size="26" fill="#5B61ED">✦</text><text x="111" y="250" font-size="13" font-weight="700">Private and secure</text><text x="111" y="271" font-size="11" fill="#68739A">Your answers stay confidential.</text><text x="24" y="346" font-size="14" font-weight="700">What’s bothering you?</text><rect x="20" y="360" width="300" height="120" rx="18" fill="#F2F3FB" stroke="#D8DDF2"/><text x="38" y="394" font-size="12" fill="#8992B0">Describe your symptoms...</text><text x="24" y="520" font-size="14" font-weight="700">A little more context</text><rect x="20" y="535" width="143" height="54" rx="16" fill="#F2F3FB" stroke="#D8DDF2"/><text x="38" y="568" font-size="12" fill="#68739A">Age</text><rect x="177" y="535" width="143" height="54" rx="16" fill="#F2F3FB" stroke="#D8DDF2"/><text x="195" y="568" font-size="12" fill="#68739A">Days</text><rect x="20" y="607" width="300" height="54" rx="16" fill="#F2F3FB" stroke="#D8DDF2"/><text x="38" y="640" font-size="12" fill="#68739A">Your location</text><rect x="20" y="687" width="300" height="52" rx="26" fill="#5B61ED"/><text x="170" y="720" text-anchor="middle" font-size="14" font-weight="700" fill="#FEFEFF">Continue  →</text><text x="170" y="778" text-anchor="middle" font-size="10" fill="#8790AF">Step 1 of 2  •  About 2 minutes</text></g>
<!-- progress -->
<g transform="translate(835 160)"><use href="#shell"/><text x="25" y="66" font-size="14" fill="#5B61ED">←</text><text x="26" y="120" font-size="24" font-weight="750">We’re reviewing</text><text x="26" y="150" font-size="24" font-weight="750">your symptoms</text><text x="26" y="180" font-size="12" fill="#68739A">NurseAI is preparing helpful next steps.</text><circle cx="170" cy="340" r="100" fill="#F2F3FB"/><circle cx="170" cy="340" r="78" fill="none" stroke="#E8DCFA" stroke-width="13"/><path d="M170 262 A78 78 0 1 1 101 303" fill="none" stroke="#5B61ED" stroke-width="13" stroke-linecap="round"/><circle cx="170" cy="340" r="57" fill="#FEFEFF"/><text x="170" y="350" text-anchor="middle" font-size="34" fill="#5B61ED">✦</text><text x="170" y="479" text-anchor="middle" font-size="17" font-weight="700">Assessing your details</text><text x="170" y="505" text-anchor="middle" font-size="11" fill="#68739A">This usually takes a few seconds</text><rect x="20" y="550" width="300" height="70" rx="19" fill="#F2F3FB"/><circle cx="54" cy="585" r="17" fill="#E8DCFA"/><text x="84" y="581" font-size="12" font-weight="700">Symptom summary</text><text x="84" y="600" font-size="10" fill="#68739A">Reviewed</text><text x="291" y="589" font-size="14" fill="#5B61ED">✓</text><rect x="20" y="632" width="300" height="70" rx="19" fill="#F2F3FB"/><circle cx="54" cy="667" r="17" fill="#E8DCFA"/><text x="84" y="663" font-size="12" font-weight="700">Finding next steps</text><text x="84" y="682" font-size="10" fill="#68739A">In progress…</text><circle cx="292" cy="667" r="9" fill="none" stroke="#85ADFE" stroke-width="3" stroke-dasharray="35 20"/><rect x="20" y="720" width="300" height="58" rx="16" fill="#E8DCFA"/><text x="42" y="746" font-size="11" fill="#28326B">AI guidance supports your care, but</text><text x="42" y="764" font-size="11" fill="#28326B">does not replace a clinician.</text></g>
<!-- result -->
<g transform="translate(1225 160)"><use href="#shell"/><text x="25" y="66" font-size="14" fill="#5B61ED">←</text><text x="26" y="120" font-size="24" font-weight="750">Your checkup</text><text x="26" y="150" font-size="12" fill="#68739A">Here’s a helpful place to start.</text><rect x="20" y="178" width="300" height="113" rx="22" fill="url(#hero)"/><text x="42" y="211" font-size="11" fill="#FEFEFF" font-weight="700">NURSEAI SUMMARY</text><text x="42" y="242" font-size="21" fill="#FEFEFF" font-weight="750">Low urgency</text><text x="42" y="266" font-size="11" fill="#FEFEFF">Based on the details you shared</text><text x="24" y="330" font-size="15" font-weight="700">Assessment summary</text><rect x="20" y="345" width="300" height="102" rx="19" fill="#F2F3FB"/><text x="38" y="376" font-size="12" fill="#28326B">Your symptoms may be consistent</text><text x="38" y="397" font-size="12" fill="#28326B">with a common infection. Monitor</text><text x="38" y="418" font-size="12" fill="#28326B">how you feel and rest.</text><text x="24" y="486" font-size="15" font-weight="700">Suggested care</text><rect x="20" y="501" width="300" height="78" rx="18" fill="#E8DCFA"/><circle cx="54" cy="540" r="20" fill="#FEFEFF"/><text x="54" y="547" text-anchor="middle" font-size="17" fill="#5B61ED">✚</text><text x="86" y="533" font-size="12" font-weight="700">Talk with a primary care</text><text x="86" y="552" font-size="12" font-weight="700">doctor if symptoms persist.</text><text x="24" y="613" font-size="14" font-weight="700">Recommended specialties</text><rect x="20" y="627" width="134" height="34" rx="17" fill="#F2F3FB"/><text x="87" y="649" text-anchor="middle" font-size="10" font-weight="700">Primary care</text><rect x="162" y="627" width="158" height="34" rx="17" fill="#F2F3FB"/><text x="241" y="649" text-anchor="middle" font-size="10" font-weight="700">Internal medicine</text><rect x="20" y="679" width="300" height="48" rx="24" fill="#5B61ED"/><text x="170" y="709" text-anchor="middle" font-size="13" font-weight="700" fill="#FEFEFF">Browse doctors  →</text><text x="28" y="758" font-size="9" fill="#68739A">AI guidance is not a diagnosis. Seek urgent</text><text x="28" y="773" font-size="9" fill="#68739A">care for severe or worsening symptoms.</text></g></g></svg>
